[project]
name = "devcluster"
version = "0.1.0"
description = "Keep a cluster of development machines in sync, and put work on the machine that has room for it."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
devcluster = "devcluster.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
